# Web 服务
server:
  port: ${SERVER_PORT:8176}

# 日志级别
logging:
  level:
    root: INFO
    com.qinglan.ai: DEBUG

spring:
  # MySQL 数据源
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/qinglan_ai
    username: ${QL_MYSQL_USERNAME}
    password: ${QL_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
